# Настройки ai-search. После изменения перезапустите фоновую службу:
#   ./ai-search restart

# Папки с файлами, которые индексируются по смыслу (код, документы, PDF).
# Остальной диск ищется через Spotlight, индексировать его не нужно.
file_roots = ["~/Desktop"]

# Что НЕ индексировать внутри этих папок: пути относительно папки, можно с *.
# Пример: ["old", "work/archive", "*/label-studio", "Скриншоты"]
# node_modules, .git, venv, build, тесты, миграции и т.п. пропускаются и так.
exclude = []

# Переписки с агентами. Отсутствующие папки просто пропускаются.
# Формат: тип = список шаблонов путей.
[chats]
claude = ["~/.claude/projects/**/*.jsonl"]
codex = ["~/.codex/sessions/**/*.jsonl", "~/.codex/archived_sessions/**/*.jsonl"]
gemini = ["~/.gemini/tmp/*/chats/*.json"]
antigravity = ["~/.gemini/antigravity*/brain/*/*.md"]

[index]
# Модель эмбеддингов: мультиязычная, понимает русский и английский вместе.
model = "BAAI/bge-m3"
# Максимальный размер текстового файла (МБ) и PDF/DOCX (МБ).
max_text_mb = 1
max_doc_mb = 30
# Сколько секунд ждать тишины после изменения, прежде чем индексировать.
debounce_files_sec = 5
debounce_chats_sec = 20
# Через сколько минут простоя выгружать модель из памяти.
model_idle_unload_min = 15
# Если перед поиском найдено больше изменений, чем это число,
# поиск идёт сразу, а индекс догоняется в фоне.
precheck_max_changes = 50

[server]
# Локальный порт фоновой службы (доступен только с этого компьютера).
port = 47400

[search]
limit = 10
snippet_chars = 600
